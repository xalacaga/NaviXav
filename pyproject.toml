[project]
name = "navixav"
version = "0.1.0"
description = "Compléteur de plan de vol IFR : SimBrief + navdata locale -> SID/STAR/approche/transitions"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "fastapi>=0.110",
    "pydantic>=2.0",
    "uvicorn>=0.29",
    "pypdf>=5.0,<7",
    # Lecture de la position dans MSFS, et fournisseur de SimConnect.dll pour
    # les machines dépourvues du SDK Microsoft Flight Simulator.
    "SimConnect>=0.4.26 ; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
navixav = "navixav.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["navixav*"]

[tool.setuptools.package-data]
"navixav.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Le dossier temporaire par défaut (%LOCALAPPDATA%\Temp\pytest-of-*) est
# devenu illisible sur cette machine : pytest ne peut plus y créer les
# répertoires de `tmp_path`. On l'isole donc dans le projet.
addopts = "--basetemp=.pytest_tmp"
