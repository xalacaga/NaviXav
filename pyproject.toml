[project]
name = "navixav"
version = "1.4.6"
description = "Compléteur de plan de vol IFR : SimBrief + navdata locale -> SID/STAR/approche/transitions"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES"]
authors = [{ name = "Xavier BEGUE", email = "xavier.begue@gmail.com" }]
readme = "README.md"
keywords = ["msfs", "simbrief", "ifr", "flight-simulator", "simconnect"]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Simulation",
]

dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "fastapi>=0.110",
    "pydantic>=2.0",
    "uvicorn>=0.29",
    "pypdf>=5.0,<7",
    # Fenêtre Windows native embarquant l'interface dans Edge WebView2.
    "pywebview>=6.0,<7 ; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://navixav.fr"
Source = "https://github.com/xalacaga/NaviXav"
Issues = "https://github.com/xalacaga/NaviXav/issues"

[project.scripts]
navixav = "navixav.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["navixav*"]

[tool.setuptools.package-data]
"navixav.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Le dossier temporaire par défaut (%LOCALAPPDATA%\Temp\pytest-of-*) est
# devenu illisible sur cette machine : pytest ne peut plus y créer les
# répertoires de `tmp_path`. On l'isole donc dans le projet.
addopts = "--basetemp=.pytest_tmp"
markers = [
    "live_msfs: tests d'intégration qui nécessitent MSFS démarré",
]
