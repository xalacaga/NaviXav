[project]
name = "navixav"
version = "0.3.0"
description = "ComplÃ©teur de plan de vol IFR : SimBrief + navdata locale -> SID/STAR/approche/transitions"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "fastapi>=0.110",
    "pydantic>=2.0",
    "uvicorn>=0.29",
    "pypdf>=5.0,<7",
    # FenÃªtre Windows native embarquant l'interface dans Edge WebView2.
    "pywebview>=6.0,<7 ; sys_platform == 'win32'",
    # Lecture de la position dans MSFS, et fournisseur de SimConnect.dll pour
    # les machines dÃ©pourvues du SDK Microsoft Flight Simulator.
    "SimConnect>=0.4.26 ; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
navixav = "navixav.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["navixav*"]

[tool.setuptools.package-data]
"navixav.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Le dossier temporaire par dÃ©faut (%LOCALAPPDATA%\Temp\pytest-of-*) est
# devenu illisible sur cette machine : pytest ne peut plus y crÃ©er les
# rÃ©pertoires de `tmp_path`. On l'isole donc dans le projet.
addopts = "--basetemp=.pytest_tmp"
markers = [
    "live_msfs: tests d'intÃ©gration qui nÃ©cessitent MSFS dÃ©marrÃ©",
]
